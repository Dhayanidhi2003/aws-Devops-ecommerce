<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudCart - E-Commerce</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header>
        <h1>🛒 CloudCart</h1>
        <p>CloudCart - AWS DevOps Demo</p>
    </header>

    <main>
        <h2>Our Products</h2>

        <div class="products">
            {% for product in products %}
            <div class="product-card">
                <div class="product-image">🛍️</div>
                <h3>{{ product.name }}</h3>
                <p class="price">{{ product.price }}</p>
                <button>Add to Cart</button>
            </div>
            {% endfor %}
        </div>
    </main>

    <footer>
        <p>CloudCart | Built with Flask + AWS + Jenkins</p>
    </footer>

</body>
</html>
